<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 508" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">bill-please-api architecture</title>
      <desc id="architecture-desc">bill-please web sends receipt scans and keeps a status stream open to bill-please-api, which checks the Turnstile token with Cloudflare, sends the photo to bill-please-ocr and only the OCR text to llm-server, and checks both dependencies every 5 seconds; Kubernetes probes livez and readyz.</desc>
